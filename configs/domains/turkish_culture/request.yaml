dataset:
  name: my_dataset
  topic: Türkiyenin kültürü ,tarihi , edebiyatı ve müzik geleneği .
  purpose: Ben bir LLM fine-tuning dataset oluşturmak istiyorum. Bu dataset, Türk kültürü, tarihi, edebiyatı, müziği, gelenekleri ve insanlarının tarihini kapsayan bilgileri içerecek. Ayrıca bu ülkenin bilinirliğini artıracak zaferler ve kültürel temelleri ile inançlarını da içerecek. Konuşma biçimleri ve davranışlarının sinerjisi de bu datasetin bir parçası olacak.
  profile: structured

research:
  max_queries: 10
  max_sources: 10
  constraints: |
    The sources must be authoritative and reliable, such as government websites, academic publications, and reputable news outlets.

  queries: []

sources:
  seed_urls: []
  preferred_domains: []

  # Optional hard controls. Omit them to apply no allowlist/blocklist.
  # allowed_domains:
  #   - kulturportali.gov.tr
  # blocked_domains:
  #   - spam.example

  source_policy:
    desired_content: []
    importance:
      authority: medium
      technical_depth: low
      information_density: high
      recency: low
      extractability: high

    # Optional source-type controls. Omitted means unrestricted.
    # preferred_source_types:
    #   - government
    # allowed_source_types:
    #   - government
    # blocked_source_types:
    #   - social_media

site_exploration:
  enabled: false
  max_seed_domains: 5
  max_depth: 5
  max_pages_per_domain: 25
  same_domain_only: true

schema:
  require_user_approval: true

extraction:
  chunking:
    enabled: true
    target_tokens: 8000
    overlap_tokens: 300

quality:
  minimum_confidence: 0.60
  low_confidence_action: review

output:
  format: json
