dataset:
  name: turkish_culture_dataset
  topic: Traditional Turkish coffee culture
  purpose: Evidence-backed records for RAG and knowledge-base systems.

research:
  auto_generate_queries: true
  max_queries: 10
  max_sources: 20
  preferred_domains: []
  reference_urls: []
  constraints: ""
  queries: []

schema:
  auto_design: true
  require_user_approval: true

extraction:
  chunking:
    enabled: true
    target_tokens: 6000
    overlap_tokens: 300

quality:
  minimum_confidence: 0.70
  low_confidence_action: reject

output:
  format: json
