dataset:
  name: space_science_dataset
  topic: Space science and astronomy , cosmos secrets , celestial bodies , space exploration and discoveries. 
  purpose: Evidence-backed records for RAG and knowledge-base systems.
  profile: structured

research:
  auto_generate_queries: true
  queries: 10
  max_sources: 5
  constraints: ""

sources:
  seed_urls: [https://imagine.gsfc.nasa.gov/science/toolbox/missions/cosmos.html]
  preferred_domains: []
  source_policy:
    desired_content: []
    importance:
      authority: medium
      technical_depth: low
      information_density: high
      recency: low
      extractability: high



extraction:
  chunking:
    enabled: true
    target_tokens: 6000
    overlap_tokens: 300

quality:
  minimum_confidence: 0.10
  low_confidence_action: reject

output:
  format: json
