<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Extraction Agent spider web</title>
  <desc id="desc">A friendly spider at the center of a web connecting research, crawling, extraction, evidence, enrichment, and export.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#24113d"/></linearGradient><radialGradient id="glow"><stop stop-color="#fbbf24" stop-opacity=".38"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="600" cy="310" r="230" fill="url(#glow)"/>
  <g fill="none" stroke="#8b5cf6" stroke-opacity=".55" stroke-width="2"><ellipse cx="600" cy="310" rx="155" ry="70"/><ellipse cx="600" cy="310" rx="280" ry="130"/><ellipse cx="600" cy="310" rx="430" ry="205"/><path d="M600 50V570M170 310H1030M293 113L907 507M907 113L293 507M415 75L785 545M785 75L415 545"/></g>
  <g fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"><path d="M600 310L190 148M600 310L1010 148M600 310L1050 430M600 310L850 555M600 310L350 555M600 310L150 430"/></g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle"><g filter="url(#shadow)"><rect x="465" y="250" width="270" height="120" rx="24" fill="#fbbf24"/><text x="600" y="292" font-size="27" font-weight="700" fill="#111827">KNOWLEDGE</text><text x="600" y="326" font-size="17" fill="#3b2a07">evidence-backed records</text></g>
    <g font-size="20" font-weight="700" fill="#f9fafb"><g><circle cx="190" cy="148" r="52" fill="#7c3aed"/><text x="190" y="143">RESEARCH</text><text x="190" y="169" font-size="14" font-weight="400">plan the hunt</text></g><g><circle cx="1010" cy="148" r="52" fill="#db2777"/><text x="1010" y="143">DISCOVER</text><text x="1010" y="169" font-size="14" font-weight="400">find sources</text></g><g><circle cx="1050" cy="430" r="52" fill="#0891b2"/><text x="1050" y="425">CRAWL</text><text x="1050" y="451" font-size="14" font-weight="400">acquire pages</text></g><g><circle cx="850" cy="555" r="52" fill="#16a34a"/><text x="850" y="550">EXTRACT</text><text x="850" y="576" font-size="14" font-weight="400">shape records</text></g><g><circle cx="350" cy="555" r="52" fill="#ea580c"/><text x="350" y="550">VERIFY</text><text x="350" y="576" font-size="14" font-weight="400">bind evidence</text></g><g><circle cx="150" cy="430" r="52" fill="#4f46e5"/><text x="150" y="425">EXPORT</text><text x="150" y="451" font-size="14" font-weight="400">RAG / graph / JSON</text></g></g></g>
  <g transform="translate(570 170)" fill="#111827" stroke="#fbbf24" stroke-width="4"><ellipse cx="30" cy="30" rx="25" ry="22"/><circle cx="18" cy="25" r="5" fill="#fff"/><circle cx="42" cy="25" r="5" fill="#fff"/><circle cx="18" cy="25" r="2"/><circle cx="42" cy="25" r="2"/><path d="M10 48L-35 25M8 55L-45 55M12 62L-30 88M50 48L95 25M52 55L105 55M48 62L90 88" fill="none" stroke-linecap="round"/></g>
</svg>
