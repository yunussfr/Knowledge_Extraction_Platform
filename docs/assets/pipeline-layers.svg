<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Extraction Agent architecture layers</title><desc id="desc">Four layers show discovery, acquisition, intelligence, and evidence-preserving outputs connected in a pipeline.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs><rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#f8fafc"><g transform="translate(45 72)"><rect width="245" height="220" rx="20" fill="#7c3aed"/><text x="24" y="45" font-size="18" font-weight="700">01 · DISCOVERY</text><text x="24" y="94" font-size="25" font-weight="700">Research plan</text><text x="24" y="135" font-size="17">Firecrawl search</text><text x="24" y="165" font-size="17">policy-aware sources</text><text x="24" y="195" font-size="14" opacity=".82">candidate URLs, not facts</text></g><g transform="translate(335 72)"><rect width="245" height="220" rx="20" fill="#0891b2"/><text x="24" y="45" font-size="18" font-weight="700">02 · ACQUISITION</text><text x="24" y="94" font-size="25" font-weight="700">Crawl4AI</text><text x="24" y="135" font-size="17">preview and acquire</text><text x="24" y="165" font-size="17">clean HTML / Markdown</text><text x="24" y="195" font-size="14" opacity=".82">bounded browser work</text></g><g transform="translate(625 72)"><rect width="245" height="220" rx="20" fill="#db2777"/><text x="24" y="45" font-size="18" font-weight="700">03 · INTELLIGENCE</text><text x="24" y="94" font-size="25" font-weight="700">Deterministic → AI</text><text x="24" y="135" font-size="17">tables, rules, chunks</text><text x="24" y="165" font-size="17">local model → Groq</text><text x="24" y="195" font-size="14" opacity=".82">quality-gated routing</text></g><g transform="translate(915 72)"><rect width="240" height="220" rx="20" fill="#16a34a"/><text x="24" y="45" font-size="18" font-weight="700">04 · KNOWLEDGE</text><text x="24" y="94" font-size="25" font-weight="700">Evidence graph</text><text x="24" y="135" font-size="17">PostgreSQL / SQLite</text><text x="24" y="165" font-size="17">RAG · GraphRAG · JSON</text><text x="24" y="195" font-size="14" opacity=".82">provenance survives export</text></g><g fill="#fbbf24" font-size="34" font-weight="700"><text x="300" y="190">→</text><text x="590" y="190">→</text><text x="880" y="190">→</text></g></g>
</svg>
